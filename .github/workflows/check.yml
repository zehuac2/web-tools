name: Check

on:
  pull_request:
  workflow_call:

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Panda CSS
        run: bun run prepare

      - name: Run check
        run: bun run check

      - name: Run tests
        run: bun run test
